[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projectflow-agent-eval"
version = "0.1.0"
description = "Standalone AgentEval benchmark harness for ProjectFlow agent outputs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[project.scripts]
projectflow-agent-eval = "app.agent_eval.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

